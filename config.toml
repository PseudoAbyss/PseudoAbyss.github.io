baseURL = "https://pseudoabyss.com/"
languageCode = "en-us"
title = "Pseudo Abyss"
theme = "hugo-winston-theme"

pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
pygmentsUseClasses = true
paginate = 3

[module]
  [module.hugoVersion]
    extended = true
    min = "0.161.1"

[params]
  google_analytics_id = ""
  twitter_handle = "@pseudoabyss"

  showAuthorOnHomepage = true
  showAuthorOnPosts = false
  showPostsOnHomepage = false
  showIntroContentOnHomepage = true

  addFrame = true
  addDot = true

  highlightColor = '#d82478'

[markup.goldmark.renderer]
unsafe = true
